    <path d="M 180 150 Q 240 180 340 195" stroke="#C8B69A" stroke-width="1.2" opacity="0.6" />
    <circle cx="210" cy="130" r="3" fill="#C8B69A" />
    <circle cx="235" cy="142" r="3" fill="#C8B69A" />
    <circle cx="260" cy="154" r="3" fill="#C8B69A" />
  </g>
  <text x="400" y="470" font-family="'Space Grotesk', 'Syne', sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#C8B69A" text-anchor="middle" text-transform="uppercase">MOD SHOES ATELIER</text>
  <text x="400" y="495" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="2" fill="#666666" text-anchor="middle">AERODYNAMIC SILHOUETTES • MILAN &amp; TOKYO</text>
