  <g transform="translate(160, 160)" stroke="url(#accentGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 60 220 Q 90 200 130 190 L 210 130 Q 250 100 290 120 L 320 150 Q 360 170 410 175 Q 430 185 430 200 Q 425 220 380 230 L 70 235 Z" fill="rgba(200, 182, 154, 0.05)" />
